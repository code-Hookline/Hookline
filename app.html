<!doctype html>
<html lang="en" data-chrome="brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hookline — workspace</title>
<meta name="description" content="Script your short-form video in blocks. Time it automatically. Ship it fast.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-icon-180x180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<noscript>
  <div style="max-width:560px;margin:14vh auto;padding:0 24px;text-align:center">
    <h1>Hookline needs JavaScript</h1>
    <p>The workspace runs entirely in your browser — there is no server to
    fall back to. Enable JavaScript to script, time, and export. Your
    content never leaves this device.</p>
    <p><a href="index.html">Back to the homepage</a></p>
  </div>
</noscript>

<div class="app" id="app" hidden>
  <div class="topbar" id="topbar"></div>

  <div class="workspace">
    <main class="builder">
      <div class="builder-head">
        <input id="scriptTitle" type="text"
               placeholder="Name your script — or just start writing below"
               aria-label="Script title" autocomplete="off"
               data-tip="Give this script a name. It is only stored in this browser.">
      </div>
      <p class="builder-sub" id="builderSub"></p>
      <div id="blocks"></div>
    </main>

    <aside class="aside">
      <section>
        <h2>Timeline — live as you type</h2>
        <div id="timeline" class="timeline-empty">
          Write a block and the timeline times it live.
        </div>
        <div class="totals" id="totals"></div>
        <div class="status ok" id="status"></div>
      </section>

      <section class="frame-sec">
        <h2>Frame</h2>
        <div class="frame-wrap"><div class="frame" id="frame" data-fmt="9:16"></div></div>
      </section>

      <section>
        <h2>Export</h2>
        <div class="exports">
          <label class="ctl full" style="justify-content:space-between">
            Teleprompter font
            <select id="telePt">
              <option value="18">18pt — Standard</option>
              <option value="22" selected>22pt — Comfortable</option>
              <option value="26">26pt — Large room / bright light</option>
              <option value="30">30pt — Maximum</option>
            </select>
          </label>
          <button class="btn full btn-primary" id="exTele"
            data-tip="Open a print-ready teleprompter — script text only, no private notes">Teleprompter PDF</button>
          <button class="btn" id="exDir"
            data-tip="Full brief: script plus your visual and director notes (private)">Director brief</button>
          <button class="btn" id="exShot"
            data-tip="Shot-by-shot list built from each block's visual note">Shot list</button>
          <button class="btn" id="exPlain"
            data-tip="Copy the plain script text to your clipboard">Copy script</button>
          <button class="btn" id="exCap"
            data-tip="Copy a ready-to-paste caption for the platform">Copy caption</button>
          <button class="btn full" id="exBatch"
            data-tip="Export every script in a campaign as one ZIP of teleprompters">Batch export (Vault)</button>
        </div>
      </section>
    </aside>
  </div>
  <div class="mobi-export">
    <button class="btn btn-primary full" id="mexTele"
      data-tip="Open a print-ready teleprompter — script text only, no private notes">Teleprompter PDF</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel-vault" aria-label="Script vault">
  <div class="panel-head"><h2>Script vault</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="vaultBody"></div>
</aside>
<aside class="panel" id="panel-hooks" aria-label="Hook library">
  <div class="panel-head"><h2>Hook library</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="hooksBody"></div>
</aside>
<aside class="panel" id="panel-frameworks" aria-label="Framework gallery">
  <div class="panel-head"><h2>Framework gallery</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="frameworksBody"></div>
</aside>
<aside class="panel" id="panel-ctas" aria-label="CTA builder">
  <div class="panel-head"><h2>CTA builder</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="ctasBody"></div>
</aside>
<aside class="panel" id="panel-calib" aria-label="Speaking pace calibrator">
  <div class="panel-head"><h2>Speaking pace calibrator</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="calibBody"></div>
</aside>
<aside class="panel" id="panel-live" aria-label="Live co-edit session">
  <div class="panel-head"><h2>Live session</h2>
    <button class="btn btn-ghost" data-close>Close</button></div>
  <div class="panel-body" id="liveBody"></div>
</aside>

<script>document.getElementById('app').hidden = false;</script>
<script type="module" src="js/app.js?v=2"></script>
<script src="js/analytics.js?v=2"></script>
</body>
</html>
